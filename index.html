<!--
 動態歌詞字幕工具（單一 HTML，雙擊用最新版 Chrome / Edge 開啟，零外部連線）
 1. 載入 SRT 與音樂/影片；未載入時為示範模式（靜音）。空白鍵播放/暫停，←→ 跳轉 5 秒。
 2. 句首標記：#版型+進場+退場~特效1,特效2，例：#neon+fade+blur-out~float；{字}{字} 用於 split / keyword / marker。
 3. 「句子編輯器」可逐句改設定並匯出帶標記的 SRT；「隨機化」找靈感；面板有預設組合與設定匯出入。
 4. 面板可設畫面比例（16:9 / 9:16）、錄製幀率、錄製輕量模式；所有參數集中在檔案頂部 CONFIG。
 5. 「全螢幕錄製」：授權時選「此分頁」並勾選分享分頁音訊；結束自動下載。示範模式錄出的影片為靜音。
 6. 錄製掉幀時：改 30 fps、開輕量模式、縮小比例、避開模糊類版型與全開疊加層。
-->
<style>

#seek{flex:1}

#panel.off{transform:translateX(100%)}
#panel label{display:block;margin:6px 0 2px}#panel input[type=range]{width:100%}
body.rec #bar,body.rec #panel,body.rec #note{display:none}
#note{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.7;z-index:5;max-width:60vw}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:30vh;background:#000;z-index:9}
.ln{height:2px;background:rgba(255,255,255,.6)}

.kb #bg{animation:flow 24s ease infinite,kb 30s ease-in-out infinite alternate}.kb #m{animation:kb 30s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.12)}}
#stage{position:fixed;inset:0;margin:auto;overflow:hidden;contain:layout paint;container-type:size;background:#050608}
/* 透明背景 / 只輸出字：預覽時以棋盤格表示透明；離線渲染時真正透明 */
html.nobg,html.nobg body{background:repeating-conic-gradient(#2b2b2b 0 25%,#3c3c3c 0 50%) 0 0/24px 24px}

html.nobg #bg,html.nobg #m,html.nobg #mimg,html.nobg #mask{display:none!important}
html.alpha #cv,html.alpha #cv2{display:none}
html.rendering.nobg,html.rendering.nobg body{background:transparent}
body.tshadow #L{text-shadow:0 2px 12px rgba(0,0,0,.35)}
